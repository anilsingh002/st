<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" opacity="0.16">
  <defs>
    <linearGradient id="mandalaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <g transform="translate(300, 300)" stroke="url(#mandalaGold)" fill="none" stroke-width="1.2">
    <!-- Concentric Circles -->
    <circle r="280" stroke-width="0.8" stroke-dasharray="6,4"/>
    <circle r="260"/>
    <circle r="220"/>
    <circle r="180"/>
    <circle r="140"/>
    <circle r="100"/>
    <circle r="60"/>
    <circle r="20"/>

    <!-- 16 Radial Lines -->
    <line x1="0" y1="-280" x2="0" y2="280" stroke-width="0.8"/>
    <line x1="-280" y1="0" x2="280" y2="0" stroke-width="0.8"/>
    <line x1="-198" y1="-198" x2="198" y2="198" stroke-width="0.8"/>
    <line x1="-198" y1="198" x2="198" y2="-198" stroke-width="0.8"/>

    <!-- 22.5 deg rays -->
    <line x1="-107" y1="-258" x2="107" y2="258" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="107" y1="-258" x2="-107" y2="258" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="-258" y1="-107" x2="258" y2="107" stroke-width="0.6" stroke-dasharray="2,2"/>
    <line x1="258" y1="-107" x2="-258" y2="107" stroke-width="0.6" stroke-dasharray="2,2"/>

    <!-- Sacred Triangles (Sri Yantra) -->
    <polygon points="0,-180 156,90 -156,90" stroke-width="1.5"/>
    <polygon points="0,180 156,-90 -156,-90" stroke-width="1.5"/>
    <polygon points="0,-140 121,70 -121,70" stroke-width="1.2"/>
    <polygon points="0,140 121,-70 -121,-70" stroke-width="1.2"/>
    <polygon points="0,-100 86,50 -86,50" stroke-width="1"/>
    <polygon points="0,100 86,-50 -86,-50" stroke-width="1"/>

    <!-- Square Enclosure (Bhu-Pura) -->
    <rect x="-240" y="-240" width="480" height="480" stroke-width="1"/>
    <rect x="-220" y="-220" width="440" height="440" stroke-width="0.8"/>
  </g>
</svg>
