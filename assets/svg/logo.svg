<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring with Cardinal Markers -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="3,1.5"/>
  <circle cx="50" cy="50" r="42" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- 8-Pointed Star / Sacred Mandala -->
  <polygon points="50,14 60,38 86,50 60,62 50,86 40,62 14,50 40,38" fill="rgba(245, 158, 11, 0.08)" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <polygon points="50,22 69,31 78,50 69,69 50,78 31,69 22,50 31,31" fill="rgba(217, 119, 6, 0.05)" stroke="url(#goldGrad)" stroke-width="0.8"/>

  <!-- Inner Triangles of Sri Yantra -->
  <polygon points="50,26 68,64 32,64" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <polygon points="50,74 68,36 32,36" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>

  <!-- Central Bindu -->
  <circle cx="50" cy="50" r="5" fill="url(#goldGlow)"/>
  <circle cx="50" cy="50" r="2" fill="#FFFDF9"/>

  <!-- Directional Cardinal N/E/S/W dots -->
  <circle cx="50" cy="8" r="2.5" fill="#D97706"/>
  <circle cx="92" cy="50" r="2.5" fill="#D97706"/>
  <circle cx="50" cy="92" r="2.5" fill="#D97706"/>
  <circle cx="8" cy="50" r="2.5" fill="#D97706"/>
</svg>
